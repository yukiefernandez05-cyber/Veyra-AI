function examplePrompt() {

document
.getElementById("prompt")
.value =
"Create a modern gaming website for my Roblox game with a hero section, game information, features, and a Play Now button.";

}


/* CREATE */

function createWebsite() {

const prompt =
document
.getElementById("prompt")
.value
.trim();

if (!prompt) {

alert("Describe your website first.");

return;

}

document
.getElementById("home")
.style
.display = "none";

document
.getElementById("builder")
.style
.display = "block";

generateWebsite(prompt);

}


/* GENERATE */

function generateWebsite(prompt) {

const text =
prompt.toLowerCase();

const title =
document.getElementById("heroTitle");

const description =
document.getElementById("heroText");


if (
text.includes("roblox") ||
text.includes("gaming") ||
text.includes("game")
) {

title.textContent =
"Welcome to Our Game";

description.textContent =
"Enter a new world and experience an amazing adventure.";

}

else if (
text.includes("business")
) {

title.textContent =
"Grow Your Business";

description.textContent =
"Professional solutions for your business.";

}

else if (
text.includes("portfolio")
) {

title.textContent =
"My Creative Portfolio";

description.textContent =
"Explore my work and projects.";

}

else if (
text.includes("store") ||
text.includes("shop")
) {

title.textContent =
"Welcome to Our Store";

description.textContent =
"Discover our latest products.";

}

else {

title.textContent =
"Your New Website";

description.textContent =
"A beautiful website created with Veyra AI.";

}

}


/* SELECT ELEMENT */

let selectedElement = null;

function selectElement(id) {

selectedElement =
document.getElementById(id);

if (!selectedElement) return;

document
.getElementById("textProperty")
.value =
selectedElement.textContent;

}


/* APPLY PROPERTIES */

function applyProperties() {

if (!selectedElement) {

alert("Select an element first.");

return;

}

const text =
document
.getElementById("textProperty")
.value;

const background =
document
.getElementById("backgroundProperty")
.value;

if (text) {

selectedElement.textContent =
text;

}

selectedElement.style.background =
background;

}


/* ADD CARD */

function addCard() {

const cards =
document.getElementById("cards");

const card =
document.createElement("div");

card.className =
"card";

card.innerHTML = `
<h3>New Feature</h3>
<p>This feature was added with Veyra.</p>
`;

cards.appendChild(card);

}


/* AI EDIT */

function aiEdit() {

const input =
document
.getElementById("aiInput");

const command =
input.value
.trim()
.toLowerCase();

if (!command) return;


/* NAVBAR */

if (
command.includes("navbar") &&
command.includes("small")
) {

document
.querySelector(".site-nav")
.style
.height = "50px";

}


/* HERO */

if (
command.includes("hero") &&
command.includes("bigger")
) {

document
.querySelector(".hero")
.style
.padding = "130px 25px";

}


/* ROUND */

if (
command.includes("rounded")
) {

document
.querySelector(".website")
.style
.borderRadius = "25px";

}


/* DARK */

if (
command.includes("dark")
) {

document
.querySelector(".website")
.style
.background = "#111";

}


/* ADD PRICING */

if (
command.includes("pricing")
) {

const section =
document.createElement("section");

section.style.padding =
"50px 25px";

section.innerHTML = `
<h2 style="text-align:center">
Pricing
</h2>

<div style="
display:flex;
gap:15px;
flex-wrap:wrap;
margin-top:25px;
">

<div class="card">
<h3>Free</h3>
<p>$0</p>
</div>

<div class="card">
<h3>Pro</h3>
<p>$30/month</p>
</div>

<div class="card">
<h3>Pro+</h3>
<p>$60/year</p>
</div>

</div>
`;

document
.getElementById("website")
.insertBefore(
section,
document.querySelector(".footer")
);

}


input.value = "";

}


/* DEVICE */

function setDevice(device) {

const website =
document.getElementById("website");

if (device === "desktop") {

website.style.maxWidth =
"1100px";

}

if (device === "tablet") {

website.style.maxWidth =
"700px";

}

if (device === "mobile") {

website.style.maxWidth =
"390px";

}

}


/* SAVE */

function saveProject() {

localStorage.setItem(
"veyraProject",
document.getElementById("website").innerHTML
);

alert("Project saved!");

}


/* UNDO */

function undo() {

document.execCommand("undo");

}


/* REDO */

function redo() {

document.execCommand("redo");

}


/* BACK */

function backHome() {

document
.getElementById("builder")
.style
.display = "none";

document
.getElementById("home")
.style
.display = "flex";

}


/* EXPORT */

function exportWebsite() {

const html =
document
.getElementById("website")
.innerHTML;

const blob =
new Blob(
[html],
{type:"text/html"}
);

const url =
URL.createObjectURL(blob);

const link =
document.createElement("a");

link.href = url;

link.download =
"veyra-website.html";

link.click();

URL.revokeObjectURL(url);

}
