<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veyra AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    /* Top bar */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;

      display: flex;
      align-items: center;

      padding: 0 18px;

      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid #eeeeee;

      backdrop-filter: blur(12px);

      z-index: 100;
    }

    .menu {
      width: 44px;
      height: 44px;

      border: none;
      border-radius: 12px;

      background: #f2f2f2;

      font-size: 22px;

      cursor: pointer;
    }

    .brand {
      margin-left: 14px;

      font-size: 21px;
      font-weight: bold;
    }

    /* Main */

    .main {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 100px 20px 40px;
    }

    .container {
      width: 100%;
      max-width: 760px;

      text-align: center;
    }

    .container h1 {
      margin: 0;

      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: -1.5px;
    }

    .container p {
      margin: 15px 0 32px;

      color: #777777;

      font-size: 17px;
    }

    /* AI prompt */

    .prompt {
      background: #ffffff;

      border: 1px solid #dddddd;
      border-radius: 20px;

      padding: 16px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.08);
    }

    textarea {
      width: 100%;
      height: 120px;

      resize: none;

      border: none;
      outline: none;

      font-family: inherit;
      font-size: 16px;

      color: #111111;
    }

    textarea::placeholder {
      color: #999999;
    }

    .prompt-footer {
      display: flex;

      justify-content: space-between;
      align-items: center;
    }

    .example {
      padding: 10px 14px;

      border: none;
      border-radius: 10px;

      background: #f2f2f2;

      cursor: pointer;
    }

    .create {
      padding: 11px 18px;

      border: none;
      border-radius: 11px;

      background: #111111;
      color: #ffffff;

      font-weight: bold;

      cursor: pointer;
    }

    .create:active,
    .menu:active {
      transform: scale(0.96);
    }

    /* Side menu */

    .overlay {
      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.25);

      opacity: 0;
      pointer-events: none;

      transition: 0.25s;

      z-index: 150;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-menu {
      position: fixed;

      top: 0;
      left: -310px;

      width: 290px;
      height: 100vh;

      background: #ffffff;

      padding: 22px 16px;

      box-shadow: 8px 0 30px rgba(0,0,0,0.12);

      transition: left 0.25s ease;

      z-index: 200;
    }

    .side-menu.open {
      left: 0;
    }

    .menu-header {
      display: flex;

      align-items: center;

      margin-bottom: 30px;
    }

    .close {
      width: 42px;
      height: 42px;

      border: none;
      border-radius: 10px;

      background: #f2f2f2;

      font-size: 20px;

      cursor: pointer;
    }

    .menu-title {
      margin-left: 13px;

      font-size: 20px;
      font-weight: bold;
    }

    .menu-item {
      width: 100%;

      padding: 14px;

      margin-bottom: 5px;

      border: none;
      border-radius: 10px;

      background: transparent;

      text-align: left;

      font-size: 15px;

      cursor: pointer;
    }

    .menu-item:hover {
      background: #f3f3f3;
    }

    /* Mobile */

    @media (max-width: 600px) {

      .topbar {
        height: 62px;
      }

      .brand {
        font-size: 19px;
      }

      .main {
        padding-top: 85px;
      }

      .container p {
        font-size: 15px;
      }

      .prompt {
        border-radius: 16px;
      }

      .side-menu {
        width: 85%;
        max-width: 300px;
      }
    }
  </style>
</head>

<body>

  <!-- Top bar -->

  <header class="topbar">

    <button class="menu" onclick="openMenu()">
      ☰
    </button>

    <div class="brand">
      ✦ Veyra
    </div>

  </header>


  <!-- Side menu -->

  <div id="overlay" class="overlay" onclick="closeMenu()"></div>

  <aside id="sideMenu" class="side-menu">

    <div class="menu-header">

      <button class="close" onclick="closeMenu()">
        ×
      </button>

      <div class="menu-title">
        ✦ Veyra
      </div>

    </div>

    <button class="menu-item">✨ New Project</button>
    <button class="menu-item">📁 My Projects</button>
    <button class="menu-item">🎨 Templates</button>
    <button class="menu-item">🧩 Components</button>
    <button class="menu-item">💎 Pricing</button>
    <button class="menu-item">👤 Account</button>
    <button class="menu-item">⚙️ Settings</button>

  </aside>


  <!-- Main -->

  <main class="main">

    <section class="container">

      <h1>What do you want to build?</h1>

      <p>
        Describe your idea and Veyra AI will build it for you.
      </p>

      <div class="prompt">

        <textarea
          id="prompt"
          placeholder="Describe your website..."
        ></textarea>

        <div class="prompt-footer">

          <button class="example" onclick="examplePrompt()">
            ✨ Example
          </button>

          <button class="create" onclick="createWebsite()">
            Create →
          </button>

        </div>

      </div>

    </section>

  </main>


  <script>

    const sideMenu =
      document.getElementById("sideMenu");

    const overlay =
      document.getElementById("overlay");

    const prompt =
      document.getElementById("prompt");


    function openMenu() {

      sideMenu.classList.add("open");
      overlay.classList.add("open");

    }


    function closeMenu() {

      sideMenu.classList.remove("open");
      overlay.classList.remove("open");

    }


    function examplePrompt() {

      prompt.value =
        "Create a modern gaming website for my Roblox game with a hero section, screenshots, features, and a Play Now button.";

      prompt.focus();

    }


    function createWebsite() {

      const text =
        prompt.value.trim();

      if (!text) {

        alert(
          "Describe your website first!"
        );

        return;

      }

      alert(
        "Veyra AI is ready to build:\n\n" +
        text
      );

    }

  </script>

</body>
  </html>
