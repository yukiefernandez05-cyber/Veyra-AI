<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veyra AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
  color: #111;
}

.topbar {
  height: 60px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  border-bottom: 1px solid #eee;
}

.menu-btn {
  border: 0;
  background: none;
  font-size: 25px;
  cursor: pointer;
}

.logo {
  margin-left: 15px;
  font-size: 20px;
  font-weight: bold;
}

.main {
  min-height: calc(100vh - 60px);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.box {
  width: 100%;
  max-width: 700px;
  text-align: center;
}

h1 {
  font-size: 42px;
  margin-bottom: 12px;
}

.description {
  color: #666;
  font-size: 17px;
  margin-bottom: 25px;
}

textarea {
  width: 100%;
  min-height: 150px;
  padding: 18px;
  border: 1px solid #ddd;
  border-radius: 15px;
  resize: vertical;
  font-size: 16px;
  outline: none;
}

textarea:focus {
  border-color: #777;
}

.actions {
  margin-top: 15px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

button {
  cursor: pointer;
}

.example {
  padding: 11px 18px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: white;
}

.create {
  padding: 11px 20px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-weight: bold;
}

.menu {
  position: fixed;
  top: 0;
  left: -280px;
  width: 280px;
  height: 100%;
  background: white;
  box-shadow: 5px 0 20px rgba(0,0,0,.15);
  padding: 25px;
  transition: .25s;
  z-index: 10;
}

.menu.open {
  left: 0;
}

.menu h2 {
  margin-top: 5px;
}

.menu-item {
  padding: 14px 5px;
  border-radius: 8px;
}

.menu-item:hover {
  background: #f2f2f2;
}

.close {
  float: right;
  border: 0;
  background: none;
  font-size: 22px;
}

/* BUILDER */

#builder {
  display: none;
  height: calc(100vh - 60px);
}

.builder-top {
  height: 55px;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  padding: 0 15px;
  gap: 10px;
}

.builder-title {
  font-weight: bold;
  flex: 1;
}

.builder-btn {
  padding: 8px 13px;
  border: 1px solid #ddd;
  background: white;
  border-radius: 8px;
}

.preview {
  height: calc(100% - 55px);
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f3f3f3;
  padding: 20px;
}

.website {
  width: min(100%, 1000px);
  height: 100%;
  background: white;
  border-radius: 12px;
  overflow: auto;
  box-shadow: 0 5px 25px rgba(0,0,0,.12);
}

.hero {
  padding: 80px 30px;
  text-align: center;
  background: linear-gradient(135deg,#111,#444);
  color: white;
}

.hero h1 {
  font-size: 45px;
  margin: 0 0 15px;
}

.hero p {
  color: #ddd;
}

.hero button {
  margin-top: 15px;
  padding: 12px 20px;
  border: 0;
  border-radius: 8px;
}

.cards {
  display: flex;
  gap: 20px;
  padding: 35px;
}
